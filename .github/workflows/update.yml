name: update-subscription

# 每天北京时间 04:17 跑（UTC 20:17）。避开整点，GitHub 的定时任务在整点容易排队延迟。
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]
    paths:                  # 只改脚本/源清单时自动重跑
      - "update.py"
      - "ci_refine.py"
      - "counts.py"
      - "remote_refine.py"
      - "sources.txt"
      - "builtin.yaml"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: subhub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --quiet pyyaml

      # 第一步：抓取 + 去重 + 代理层测速（美国视角）
      # 这一层筛的是"节点自身是否工作"，runner 在美国，够用且快。
      - name: 抓取 + 测速（美国视角候选池）
        run: python update.py

      # 第二步：中国视角精筛
      # runner 在美国，做不了"从中国能不能连"。SSH 到腾讯云广州（出口 China/Shanghai）
      # 用中国 IP 做 TCP 预筛 —— 实测这一层的结论与家庭宽带完全一致（7/100 = 7/100）。
      # 代理层不在云上测：免费节点普遍封云厂商 IP，云上恒为 0（本机 6/7 vs 云上 0/7）。
      - name: 中国视角 TCP 预筛（腾讯云广州）
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::未配置 SSH_HOST / SSH_KEY secret，跳过中国视角精筛"
            exit 0
          fi
          KEY="$RUNNER_TEMP/ssh_key"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          SSH_KEY_PATH="$KEY" SSH_USER="${SSH_USER:-root}" python ci_refine.py

      - name: 提交变更
        run: |
          FILES=""
          [ -f dist/config.yaml ] && FILES="dist/config.yaml dist/stats.json"
          [ -f dist/config-cn.yaml ] && FILES="$FILES dist/config-cn.yaml dist/stats-cn.json"
          if [ -z "$FILES" ]; then
            echo "本次未生成任何配置（可用节点不足），跳过提交"
            exit 0
          fi
          git config user.name  "subhub-bot"
          git config user.email "subhub-bot@users.noreply.github.com"
          git add $FILES
          if git diff --staged --quiet; then
            echo "内容无变化，不产生空提交"
          else
            N=$(python counts.py)
            git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%dT%H:%MZ) | ${N}"
            git push
          fi

      # 合并版：付费机场 + 自建 + 中国视角筛过的公共节点
      # 里面有付费节点凭据，**不提交到仓库**，只 SCP 到腾讯云由 serve.py 私有提供。
      # 机场订阅地址走 secret，不进公开仓库（公开=节点被白嫖+机场封号）。
      - name: 生成并上传合并配置（付费机场+自建+免费）
        env:
          AIRPORT_SUBS: ${{ secrets.AIRPORT_SUBS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$AIRPORT_SUBS" ]; then
            echo "::warning::未配置 AIRPORT_SUBS secret，跳过合并版"
            exit 0
          fi
          KEY="$RUNNER_TEMP/ssh_key_merge"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          SSH_KEY_PATH="$KEY" SSH_HOST="$SSH_HOST" SSH_USER="${SSH_USER:-root}" \
            python merge.py --push

      # jsDelivr 的 @main 分支别名有 ~12h 缓存，purge 也刷不掉（实测），所以正式订阅地址用
      # gh-proxy 直通 raw。这一步从中国大陆入口回读一次，确认订阅真的能取到、且是刚生成的版本。
      - name: 回读订阅校验（中国镜像）
        run: |
          URL="https://gh-proxy.com/https://raw.githubusercontent.com/${{ github.repository }}/main/dist/config-cn.yaml"
          BODY=$(curl -s --max-time 30 "$URL" || true)
          if [ -z "$BODY" ]; then
            echo "::warning::镜像取不到，跳过校验（不影响已提交的配置）"
            exit 0
          fi
          echo "$BODY" | head -3
          NP=$(echo "$BODY" | grep -c "name: PUB" || true)
          NG=$(echo "$BODY" | grep -c "name: 🏠" || true)
          echo "回读结果：公共 ${NP} + 自建 ${NG}"
          if [ "$NG" -lt 1 ]; then
            echo "::warning::回读内容不含自建节点，镜像可能返回了旧版或错误页"
          fi
