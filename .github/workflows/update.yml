name: update-subscription

# 每天北京时间 04:17 跑（UTC 20:17）。避开整点，GitHub 的定时任务在整点容易排队延迟。
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]
    paths:                  # 只改脚本/源清单时自动重跑
      - "update.py"
      - "ci_refine.py"
      - "counts.py"
      - "remote_refine.py"
      - "sources.txt"
      - "builtin.yaml"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: subhub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --quiet pyyaml

      # 第一步：抓取 + 去重 + 代理层测速（美国视角）
      # 这一层筛的是"节点自身是否工作"，runner 在美国，够用且快。
      - name: 抓取 + 测速（美国视角候选池）
        run: python update.py

      # 第二步：中国视角精筛
      # runner 在美国，做不了"从中国能不能连"。SSH 到腾讯云广州（出口 China/Shanghai）
      # 用中国 IP 做 TCP 预筛 —— 实测这一层的结论与家庭宽带完全一致（7/100 = 7/100）。
      # 代理层不在云上测：免费节点普遍封云厂商 IP，云上恒为 0（本机 6/7 vs 云上 0/7）。
      - name: 中国视角 TCP 预筛（腾讯云广州）
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::未配置 SSH_HOST / SSH_KEY secret，跳过中国视角精筛"
            exit 0
          fi
          KEY="$RUNNER_TEMP/ssh_key"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          SSH_KEY_PATH="$KEY" SSH_USER="${SSH_USER:-root}" python ci_refine.py

      - name: 提交变更
        run: |
          FILES=""
          [ -f dist/config.yaml ] && FILES="dist/config.yaml dist/stats.json"
          [ -f dist/config-cn.yaml ] && FILES="$FILES dist/config-cn.yaml dist/stats-cn.json"
          if [ -z "$FILES" ]; then
            echo "本次未生成任何配置（可用节点不足），跳过提交"
            exit 0
          fi
          git config user.name  "subhub-bot"
          git config user.email "subhub-bot@users.noreply.github.com"
          git add $FILES
          if git diff --staged --quiet; then
            echo "内容无变化，不产生空提交"
          else
            N=$(python counts.py)
            git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%dT%H:%MZ) | ${N}"
            git push
          fi

      # jsDelivr 对 @main 有 12 小时缓存，不主动刷就会让用户订到旧文件。
      # 失败不影响主流程（只是新鲜度差一点）。
      - name: 刷新 jsDelivr 缓存
        run: |
          for f in dist/config-cn.yaml dist/config.yaml; do
            curl -s --max-time 25 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true
            echo " purged $f"
          done
