# ============================================================================
# subhub 合并订阅（静态版）
# ----------------------------------------------------------------------------
# 思路：不抓取、不重生成。用 mihomo 原生的 proxy-providers，让客户端自己去拉
#       这 6 个源，它们本来就每天自动更新。这份文件写完就不用再改。
#
# 分流：国内 IP / .cn 域名 直连，其余走代理。
# 用法：FlClash → 配置 → 添加 → 从 URL 导入 → 粘贴本文件地址。
# ============================================================================

mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ---------------------------------------------------------------------------
# 6 个源。url 一律加 gh-proxy 前缀：raw.githubusercontent.com 在国内会
# ConnectionReset（实测 anaer / free18 / ripaojiedian 直连直接断，mahdibland
# 要 43s），走 gh-proxy 后 1.3~5.0s 全部正常。
#
# exclude-filter 用 RE2 语法（Go 不支持 (?!) 负向断言，所以写在 exclude 里）：
# 这些公开源普遍混着「剩余流量：xxGB」「官网：xxx」「过期时间」这类广告假节点，
# 名字对但连不上，先剔掉能省掉大量无用的健康检查。
# ---------------------------------------------------------------------------
proxy-providers:
  anaer:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml"
    path: ./providers/anaer.yaml
    interval: 21600          # 6 小时
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

  free18:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/free18/v2ray/main/c.yaml"
    path: ./providers/free18.yaml
    interval: 21600
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

  mahdibland:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/Eternity.yml"
    path: ./providers/mahdibland.yaml
    interval: 21600
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

  peasoft:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
    path: ./providers/peasoft.yaml
    interval: 21600
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

  ripaojiedian:
    type: http
    url: "https://gh-proxy.com/https://raw.githubusercontent.com/ripaojiedian/freenode/main/clash"
    path: ./providers/ripaojiedian.yaml
    interval: 21600
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

  ermaozi:
    type: http
    url: "https://raw.githubusercontent.com/ermaozi01/free_clash_vpn/main/subscribe/clash.yml"
    path: ./providers/ermaozi.yaml
    interval: 21600
    exclude-filter: "(?i)(剩余|流量|过期|到期|官网|官方|订阅|重置|群组|频道|telegram|t\\.me|expire|traffic|www\\.)"
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 600
      lazy: true

