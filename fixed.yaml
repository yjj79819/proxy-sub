# ---------------------------------------------------------------------------
# 分组：
#   每个源一个 url-test 子组（某个源全挂时可以在手动选择里直接跳过它）
#   境外代理 = fallback，自建优先 → 各源子组依次兜底
#   fallback 里绝不放 DIRECT：境外站直连本来就不通，放 DIRECT 会把「节点挂了」
#   伪装成「正常直连」，排查时极具误导性（2026-10-27 踩过）
# ---------------------------------------------------------------------------
proxy-groups:
  # 日常路径。注意这里**故意不含 anaer**：
  # anaer 有 2487 个节点，占全部节点的 83%，实测冷启动测速几分钟才推进 4%，
  # 而其余 5 源合计 500 个节点在同一时间已 100% 测完。放进来会把整条
  # fallback 链的健康检查一起拖慢，等于为了 83% 的死重牺牲日常可用性。
  # anaer 没删，降级挂在「🎯 手动选择」末尾，想翻它就去点，不点就不测（lazy）。
  - name: "🚀 境外代理"
    type: fallback
    url: http://cp.cloudflare.com/generate_204
    interval: 180
    timeout: 3000
    proxies:
      - "🏠 自建 fast3"
      - "🏠 自建 fast5"
      - "🏠 自建 fast2"
      - "🏠 自建 fast4"
      - "♻️ peasoft"
      - "♻️ mahdibland"
      - "♻️ free18"
      - "♻️ ripaojiedian"
      - "♻️ ermaozi"

  # anaer 单独拉长到 1 小时：它不走日常路径，只在手动点开时才有意义
  - name: "♻️ anaer"
    type: url-test
    use: [anaer]
    url: http://cp.cloudflare.com/generate_204
    interval: 3600
    tolerance: 80
    lazy: true
  - name: "♻️ peasoft"
    type: url-test
    use: [peasoft]
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true
  - name: "♻️ mahdibland"
    type: url-test
    use: [mahdibland]
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true
  - name: "♻️ ripaojiedian"
    type: url-test
    use: [ripaojiedian]
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true
  - name: "♻️ free18"
    type: url-test
    use: [free18]
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true
  - name: "♻️ ermaozi"
    type: url-test
    use: [ermaozi]
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true

  - name: "🎯 手动选择"
    type: select
    proxies:
      - "🚀 境外代理"
      - "🏠 自建 fast3"
      - "🏠 自建 fast5"
      - "🏠 自建 fast2"
      - "🏠 自建 fast4"
      - "♻️ peasoft"
      - "♻️ mahdibland"
      - "♻️ free18"
      - "♻️ ripaojiedian"
      - "♻️ ermaozi"
      - "♻️ anaer"
      - DIRECT

# ---------------------------------------------------------------------------
# 分流：国内直连、其余代理。
# 没用 GEOSITE 分类名 —— 本机 GeoSite.dat 的分类名大小写敏感，小写会静默不匹配
# （2026-10-27 踩过），只用 GEOIP + 域名后缀最稳。
# ---------------------------------------------------------------------------
rules:
  - GEOIP,lan,DIRECT,no-resolve
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🚀 境外代理
